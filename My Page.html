    <script>
 let currentIndex = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const intervalTime = 20000; // 20 Seconds
let slideInterval;
let progress = 0;
const progressBar = document.getElementById('progressBar');
const tickRate = 100; // Update every 100ms
const step = (tickRate / intervalTime) * 100; // How much % to add each tick
let progressInterval;

// New state variables
let isPaused = false;
let isMuted = true; // Videos start muted

// --- Recording variables ---
let mediaRecorder;
let recordedChunks = [];
let mediaStream;


function updateProgress() {
    progress += step;
    progressBar.style.width = progress + "%";

    if (progress >= 100) {
        // This will be reset by showSlide, which is triggered by nextSlide
    }
}

function resetProgress() {
    progress = 0;
    progressBar.style.width = "0%";
}

function showSlide(index) {
    // Safety check for index out of bounds
    if (index >= slides.length) index = 0;
    if (index < 0) index = slides.length - 1;

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));
    
    document.querySelectorAll('video').forEach(v => v.pause());

    currentIndex = index;
    slides[currentIndex].classList.add('active');
    dots[currentIndex].classList.add('active');
    
    const currentVideo = slides[currentIndex].querySelector('video');
    if (currentVideo) {
        currentVideo.muted = isMuted;
        currentVideo.currentTime = 0;
        currentVideo.play().catch(e => console.error("Video play failed:", e));
    }
    
    resetProgress();
}

function nextSlide() {
    let next = (currentIndex + 1) % slides.length;
    showSlide(next);
}

function currentSlide(index) {
    showSlide(index);
    if(!isPaused) resetTimer();
}

function changeSlide(direction) {
    let next = (currentIndex + direction + slides.length) % slides.length;
    showSlide(next);
    if(!isPaused) resetTimer();
}

function resetTimer() {
    clearInterval(slideInterval);
    clearInterval(progressInterval);
    slideInterval = setInterval(nextSlide, intervalTime);
    progressInterval = setInterval(updateProgress, tickRate);
    
    const playPauseBtn = document.getElementById('playPauseBtn');
    if (playPauseBtn) playPauseBtn.textContent = 'Pause';
    isPaused = false;
}

// --- Control Functions ---

function togglePlayPause() {
    isPaused = !isPaused;
    const playPauseBtn = document.getElementById('playPauseBtn');

    if (isPaused) {
        clearInterval(slideInterval);
        clearInterval(progressInterval);
        playPauseBtn.textContent = 'Play';
    } else {
        resetTimer();
        playPauseBtn.textContent = 'Pause';
    }
}

function toggleMute() {
    isMuted = !isMuted;
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    document.querySelectorAll('video').forEach(v => {
        v.muted = isMuted;
    });
}

function toggleFullscreen() {
  const elem = document.querySelector('.slide.active');
  if (elem) {
    elem.classList.toggle('fake-fullscreen');
  }
}

// --- Recording Functions ---

async function startRecording() {
    try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" }
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recording.webm';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        };

        mediaRecorder.start();
        document.getElementById('startRecordBtn').style.display = 'none';
        document.getElementById('stopRecordBtn').style.display = '';

    } catch (err) {
        console.error("Error starting recording:", err);
        alert("Could not start recording. Please ensure you grant permission and your browser supports screen recording.");
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('startRecordBtn').style.display = '';
    document.getElementById('stopRecordBtn').style.display = 'none';
}


// --- Event Listeners ---

document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {
        changeSlide(-1);
    } else if (event.key === 'ArrowRight') {
        changeSlide(1);
    }
});

const headerRssUrls = [
    'https://feeds.skynews.com/feeds/rss/world.xml',
    'https://feeds.skynews.com/feeds/rss/us.xml',
    'https://feeds.skynews.com/feeds/rss/strange.xml',
];
const footerRssUrls = [
    'https://feeds.finance.yahoo.com/rss/2.0/headline?s=yhoo,goog&region=US&lang=en-US',
    
];

async function updateTicker(urls, elementId) {
    const tickerElement = document.getElementById(elementId);
    if (!tickerElement) return;

    try {
        let allTitles = [];
        const parser = new DOMParser();

        for (const url of urls) {
            // Try multiple proxies for each URL to ensure content is retrieved
            const proxyUrls = [
                `https://api.allorigins.win/get?url=${encodeURIComponent(url.trim())}&_=${Date.now()}`,
                `https://corsproxy.io/?${encodeURIComponent(url.trim())}`
            ];

            for (const proxyUrl of proxyUrls) {
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) continue;

                    let xmlText;
                    // Handle JSON response from AllOrigins or raw text from Corsproxy
                    if (proxyUrl.includes('allorigins.win')) {
                        const data = await response.json();
                        xmlText = data.contents;
                    } else {
                        xmlText = await response.text();
                    }

                    if (!xmlText) continue;

                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    // Check if parsing failed (e.g. proxy returned an HTML error page instead of RSS)
                    if (xmlDoc.getElementsByTagName("parsererror").length > 0) continue;

                    const items = xmlDoc.querySelectorAll("item, entry");
                    
                    if (items.length > 0) {
                        items.forEach(item => {
                            const title = item.querySelector("title")?.textContent;
                            if (title) allTitles.push(title.trim());
                        });
                        break; // Success found for this feed, stop trying other proxies for it
                    }
                } catch (err) {
                    console.warn(`Proxy attempt failed for ${url} using ${proxyUrl}:`, err);
                }
            }
        }

        if (allTitles.length > 0) {
            tickerElement.innerHTML = '';
            allTitles.forEach(title => {
                const span = document.createElement('span');
                span.className = 'ticker-item';
                span.textContent = `● ${title}`;
                tickerElement.appendChild(span);
            });
        } else {
            tickerElement.innerText = "News temporarily unavailable. Retrying...";
            setTimeout(() => updateTicker(urls, elementId), 15000); 
        }
    } catch (error) {
        console.error(`Error updating ${elementId}:`, error);
        tickerElement.innerText = "Connection error.";
    }
}

async function fetchNews() {
    updateTicker(headerRssUrls, 'news-ticker');
    updateTicker(footerRssUrls, 'footer-ticker');
}

// Use a more immediate initialization pattern
function init() {
    // Hook up buttons
    if(document.getElementById('playPauseBtn')) document.getElementById('playPauseBtn').onclick = togglePlayPause;
    if(document.getElementById('muteBtn')) document.getElementById('muteBtn').onclick = toggleMute;
    if(document.getElementById('fullscreenBtn')) document.getElementById('fullscreenBtn').onclick = toggleFullscreen;
    if(document.getElementById('refreshBtn')) document.getElementById('refreshBtn').onclick = () => location.reload();
    if(document.getElementById('startRecordBtn')) document.getElementById('startRecordBtn').onclick = startRecording;
    if(document.getElementById('stopRecordBtn')) document.getElementById('stopRecordBtn').onclick = stopRecording;

    slides.forEach(slide => {
        slide.addEventListener('dblclick', () => {
            toggleFullscreen();
        });
    });

    // Initialize News Ticker
    fetchNews();

    showSlide(0);
    resetTimer();
}

// Initialize immediately since script is at the bottom
init();

  setInterval(function() {
    // Targeted refresh for all Google Sheet iframes
    const iframes = document.querySelectorAll('iframe[src*="docs.google.com/spreadsheets"]');
    iframes.forEach(iframe => {
      let src = iframe.src.split('?')[0]; 
      let params = new URLSearchParams(iframe.src.split('?')[1] || '');
      params.delete('_cache_bust'); // Remove old cache buster if it exists
      src += '?' + params.toString() + '&_cache_bust=' + new Date().getTime();
      iframe.src = src;
    });
  }, 60000); // 60000ms = 1 minute
</script>
