    <script>
 let currentIndex = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const intervalTime = 20000; // 20 Seconds
let slideInterval;
let progress = 0;
const progressBar = document.getElementById('progressBar');
const tickRate = 100; // Update every 100ms
const step = (tickRate / intervalTime) * 100; // How much % to add each tick
let progressInterval;

// New state variables
let isPaused = false;
let isMuted = true; // Videos start muted

// --- Recording variables ---
let mediaRecorder;
let recordedChunks = [];
let mediaStream;


function updateProgress() {
    progress += step;
    progressBar.style.width = progress + "%";

    if (progress >= 100) {
        // This will be reset by showSlide, which is triggered by nextSlide
    }
}

function resetProgress() {
    progress = 0;
    progressBar.style.width = "0%";
}

function showSlide(index) {
    // Safety check for index out of bounds
    if (index >= slides.length) index = 0;
    if (index < 0) index = slides.length - 1;

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));
    
    document.querySelectorAll('video').forEach(v => v.pause());

    currentIndex = index;
    slides[currentIndex].classList.add('active');
    if (dots[currentIndex]) dots[currentIndex].classList.add('active');
    
    const currentVideo = slides[currentIndex].querySelector('video');
    if (currentVideo) {
        currentVideo.muted = isMuted;
        currentVideo.currentTime = 0;
        currentVideo.play().catch(e => console.error("Video play failed:", e));
    }
    
    resetProgress();
}

function nextSlide() {
    let next = (currentIndex + 1) % slides.length;
    showSlide(next);
}

function currentSlide(index) {
    showSlide(index);
    if(!isPaused) resetTimer();
}

function changeSlide(direction) {
    let next = (currentIndex + direction + slides.length) % slides.length;
    showSlide(next);
    if(!isPaused) resetTimer();
}

function resetTimer() {
    clearInterval(slideInterval);
    clearInterval(progressInterval);
    slideInterval = setInterval(nextSlide, intervalTime);
    progressInterval = setInterval(updateProgress, tickRate);
    
    const playPauseBtn = document.getElementById('playPauseBtn');
    if (playPauseBtn) playPauseBtn.textContent = 'Pause';
    isPaused = false;
}

// --- Control Functions ---

function togglePlayPause() {
    isPaused = !isPaused;
    const playPauseBtn = document.getElementById('playPauseBtn');

    if (isPaused) {
        clearInterval(slideInterval);
        clearInterval(progressInterval);
        playPauseBtn.textContent = 'Play';
    } else {
        resetTimer();
        playPauseBtn.textContent = 'Pause';
    }
}

function toggleMute() {
    isMuted = !isMuted;
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    document.querySelectorAll('video').forEach(v => {
        v.muted = isMuted;
    });
}

function toggleFullscreen() {
  const elem = document.querySelector('.slide.active');
  if (elem) {
    elem.classList.toggle('fake-fullscreen');
  }
}

// --- Recording Functions ---

async function startRecording() {
    try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" }
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recording.webm';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        };

        mediaRecorder.start();
        document.getElementById('startRecordBtn').style.display = 'none';
        document.getElementById('stopRecordBtn').style.display = '';

    } catch (err) {
        console.error("Error starting recording:", err);
        alert("Could not start recording. Please ensure you grant permission and your browser supports screen recording.");
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('startRecordBtn').style.display = '';
    document.getElementById('stopRecordBtn').style.display = 'none';
}


// --- Event Listeners ---

document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {
        changeSlide(-1);
    } else if (event.key === 'ArrowRight') {
        changeSlide(1);
    }
});

const headerRssUrls = [
    'https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/x_news.json',
    'data/x_news.json' 
];

const footerRssUrls = [
    'https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/Stock%20Watch.xml',
    'data/Stock%20Watch.xml'
];

async function updateTicker(urls, elementId) {
    const tickerElement = document.getElementById(elementId);
    if (!tickerElement) return;

    try {
        let allTitles = [];
        const parser = new DOMParser();

        for (const url of urls) {
            const cleanUrl = url.trim();
            let proxyUrls = [];

            if (cleanUrl.startsWith('https://raw.githubusercontent.com')) {
                proxyUrls = [ `${cleanUrl}?t=${Date.now()}`, `https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl + '?t=' + Date.now())}` ];
            } else if (cleanUrl.startsWith('http')) {
                proxyUrls = [
                    `https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl)}&_=${Date.now()}`,
                    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(cleanUrl)}`
                ];
            } else {
                // Local files
                proxyUrls = [cleanUrl];
            }

            for (const proxyUrl of proxyUrls) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const response = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
                    clearTimeout(timeoutId);

                    if (!response.ok) continue;

                    let responseText;
                    if (proxyUrl.includes('allorigins.win')) {
                        try {
                            const data = await response.json();
                            responseText = data.contents;
                        } catch (e) { continue; }
                    } else {
                        responseText = await response.text();
                    }

                    if (!responseText || responseText.trim() === "") continue;
                    const trimmed = responseText.trim();
                    const isHeader = elementId === 'news-ticker';

                    // 1. Handle JSONX Format
                    if (trimmed.startsWith('[') || (trimmed.startsWith('{') && !trimmed.includes('"error":'))) {
                        const titles = parseJsonX(trimmed, isHeader);
                        if (titles.length) { allTitles.push(...titles); break; }
                    }

                    // 2. Handle Google Sheets CSV Format
                    if (cleanUrl.toLowerCase().includes('output=csv')) {
                        const titles = parseCsvData(trimmed);
                        if (titles.length) { allTitles.push(...titles); break; }
                    }

                    // 3. Handle RSS or Stock XML Format
                    if (trimmed.startsWith('<')) {
                    const xmlDoc = parser.parseFromString(responseText, "text/xml");
                    if (xmlDoc.getElementsByTagName("parsererror").length > 0) continue;
                    const titles = parseXmlData(xmlDoc, isHeader);
                    if (titles.length) { allTitles.push(...titles); break; }
                    }

                } catch (err) {
                    console.warn(`Proxy attempt failed for ${url} using ${proxyUrl}:`, err);
                }
            }
        }

        if (allTitles.length > 0) {
            const tickerHtml = allTitles.join(' <span class="text-slate-600 text-3xl">|</span> ');
            tickerElement.innerHTML = tickerHtml + ' <span class="text-slate-600 text-3xl">|</span> ' + tickerHtml;
            // Force animation restart to recalculate width
            tickerElement.style.animation = 'none';
            tickerElement.offsetHeight; // trigger reflow
            tickerElement.style.animation = '';
            tickerElement.style.animationDuration = Math.max(25, allTitles.length * 5) + 's';
        } else {
            if (tickerElement.innerHTML.includes('Connecting')) {
                tickerElement.innerHTML = `<span class="text-red-500 p-4">Data unavailable. Retrying...</span>`;
                setTimeout(() => updateTicker(urls, elementId), 15000);
            }
        }
    } catch (error) {
        console.error(`Error updating ${elementId}:`, error);
        tickerElement.innerText = "Connection error.";
    }
}

/**
 * Normalizes source names to requested handles and cleaner labels.
 */
function formatSourceLabel(name) {
    let s = (name || '').trim().toUpperCase();
    
    // If the backend already passed @HANDLE, return it
    if (s.startsWith('@')) return s;

    // Fallback regex to extract @handle from raw titles
    const handleMatch = s.match(/@([A-Z0-9_]+)/i);
    if (handleMatch) return `@${handleMatch[1]}`;

    return s || "NEWS";
}

function parseJsonX(text, isHeader = false) {
    try {
        let data = JSON.parse(text);
        if (!Array.isArray(data)) {
            if (data.news && Array.isArray(data.news)) data = data.news;
            else if (data.alerts && Array.isArray(data.alerts)) data = data.alerts;
            else if (data.headline || data.title) data = [data];
            else return [];
        }
        return data.map(entry => {
            const level = (entry.alert_level || 'LOW').toUpperCase();
            const sourceLabel = formatSourceLabel(entry.source);
            
            const region = entry.primary_region ? ` [${entry.primary_region}]` : '';
            const alertClass = level === 'HIGH' ? 'bg-red-900/40 border-red-700 text-red-400' : 
                             level === 'MEDIUM' ? 'bg-amber-900/40 border-amber-700 text-amber-400' : 
                             'bg-slate-900 border-slate-700 text-white';

            const wrapperClass = isHeader ? 'ticker-item-wrapper' : 'inline-flex';

            return `<span class="mx-16 ${wrapperClass} items-center">
                <span class="px-2 py-0.5 rounded border ${alertClass} font-black text-xs mr-3 tracking-widest">${level} ${sourceLabel}</span>
                <span class="text-white text-3xl font-bold">${entry.headline}${region}</span>
            </span>`;
        });
    } catch (e) { return []; }
}

function parseCsvData(text) {
    const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
    if (lines.length <= 1) return [];
    lines.shift(); // Remove header
    return lines.map(line => {
        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/g).map(cell => cell.trim().replace(/^"(.*)"$/, '$1'));
        if (cols[0] && cols[1]) {
            const price = parseFloat(cols[1].replace(/[^0-9.-]+/g, "") || 0).toFixed(2);
            return `<span class="mx-16 inline-flex items-center">
                <span class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 font-black text-xs mr-3 tracking-widest">SHEET</span>
                <span class="text-white text-3xl font-bold">${cols[0]}: $${price}</span>
            </span>`;
        }
        return null;
    }).filter(x => x);
}

function parseXmlData(xmlDoc, isHeader = false) {
    const allTitles = [];
    const rawTitleEl = xmlDoc.querySelector("channel > title, feed > title, Organization");
    const feedLabel = formatSourceLabel(rawTitleEl ? rawTitleEl.textContent : "NEWS");
    const wrapperClass = isHeader ? 'ticker-item-wrapper' : 'inline-flex';

    const items = xmlDoc.querySelectorAll("item, entry, Stock, stock");
    items.forEach(item => {
        if (item.tagName.toUpperCase() === 'STOCK') {
            const ticker = item.getAttribute('ticker') || 'N/A';
            const price = item.querySelector('Price')?.textContent || 'N/A';
            const change = item.querySelector('DaysChange')?.textContent || '0%';
            const status = (item.querySelector('warming_cooling')?.textContent || 'N/A').toUpperCase();
            
            const statusBg = status === 'WARMING' ? 'bg-green-900/40 border-green-700 text-green-400' : 
                             status === 'COOLING' ? 'bg-red-900/40 border-red-700 text-red-400' : 
                             'bg-slate-900 border-slate-700 text-white';

            allTitles.push(`<span class="mx-16 ${wrapperClass} items-center">
                <span class="font-black text-white text-4xl mr-3">${ticker}</span> 
                <span class="text-slate-400 text-2xl mr-3">${price}</span> 
                <span class="text-white text-2xl mr-4">${change}</span> 
                <span class="px-4 py-1 rounded border font-mono text-xl ${statusBg}">
                    ${status}
                </span> 
            </span>`);
        } else {
            const title = item.querySelector("title")?.textContent;
            if (title) {
                allTitles.push(`<span class="mx-16 ${wrapperClass} items-center">
                    <span class="px-2 py-0.5 rounded border border-red-700 bg-red-900/40 text-red-400 font-black text-xs mr-3 tracking-widest">${feedLabel}</span>
                    <span class="text-white text-3xl font-bold">${title.trim()}</span>
                </span>`);
            }
        }
    });
    return allTitles;
}

async function fetchNews() {
    updateTicker(headerRssUrls, 'news-ticker');
    updateTicker(footerRssUrls, 'footer-ticker');
}

// Use a more immediate initialization pattern
function init() {
    // Hook up buttons
    if(document.getElementById('playPauseBtn')) document.getElementById('playPauseBtn').onclick = togglePlayPause;
    if(document.getElementById('muteBtn')) document.getElementById('muteBtn').onclick = toggleMute;
    if(document.getElementById('fullscreenBtn')) document.getElementById('fullscreenBtn').onclick = toggleFullscreen;
    if(document.getElementById('refreshBtn')) document.getElementById('refreshBtn').onclick = () => location.reload();
    if(document.getElementById('startRecordBtn')) document.getElementById('startRecordBtn').onclick = startRecording;
    if(document.getElementById('stopRecordBtn')) document.getElementById('stopRecordBtn').onclick = stopRecording;

    slides.forEach(slide => {
        slide.addEventListener('dblclick', () => {
            toggleFullscreen();
        });
    });

    // Initialize News Ticker
    fetchNews();

    showSlide(0);
    resetTimer();
}

// Initialize immediately since script is at the bottom
init();

  setInterval(function() {
    // Refresh news tickers to pick up 6am, 9am, and 1pm updates automatically
    fetchNews();

    // Targeted refresh for all Google Sheet iframes
    const iframes = document.querySelectorAll('iframe[src*="docs.google.com/spreadsheets"]');
    iframes.forEach(iframe => {
      let src = iframe.src.split('?')[0]; 
      let params = new URLSearchParams(iframe.src.split('?')[1] || '');
      params.delete('_cache_bust'); // Remove old cache buster if it exists
      src += '?' + params.toString() + '&_cache_bust=' + new Date().getTime();
      iframe.src = src;
    });
  }, 60000); // 60000ms = 1 minute
</script>
