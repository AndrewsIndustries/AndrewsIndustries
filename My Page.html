<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Page</title>
  <link rel="icon" type="image/x-icon" href="images/Icon/FlagEaglenoback.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('images/Backgrounds/vintage.avif'); 
      background-color: #0f172a; 
      color: #f8fafc; 
      overflow: hidden; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding-top: 48px; 
      padding-bottom: 48px; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .slider-container {
      width: 100%; 
      height: calc(100vh - 96px); 
      position: relative; 
      overflow: hidden; 
    }

    .slider {
      width: 100%; 
      height: 100%; 
      position: relative; 
    }

    .slide {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      opacity: 0; 
      visibility: hidden; 
      transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out; 
      z-index: 1; 
    }

    .slide.active {
      opacity: 1; 
      visibility: visible; 
      z-index: 10; 
    }

    .slide iframe {
      width: 100%; 
      height: 100%; 
      border: none; 
    }

    .fake-fullscreen {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      z-index: 9999 !important; 
      padding: 0 !important; 
      margin: 0 !important; 
    }

    .prev, .next {
      position: absolute; 
      top: 50%; 
      transform: translateY(-50%); 
      z-index: 1000; 
      color: rgba(255, 255, 255, 0.6); 
      font-size: 2rem; 
      padding: 16px; 
      cursor: pointer; 
      user-select: none; 
      transition: all 0.2s ease; 
      background: rgba(15,23,42,0.5); 
      border-radius: 50%; 
      width: 50px; 
      height: 50px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: 1px solid rgba(255,255,255,0.05); 
    }

    .prev { left: 20px; }
    .next { right: 20px; }

    .prev:hover, .next:hover {
      color: #fff; 
      background: rgba(220, 38, 38, 0.8); 
      border-color: #dc2626; 
    }

    .dots {
      position: absolute; 
      bottom: 24px; 
      left: 50%; 
      transform: translateX(-50%); 
      z-index: 10000; 
      display: flex; 
      gap: 6px; 
      background: rgba(15,23,42,0.6); 
      padding: 6px 12px; 
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.05); 
    }

    .dot {
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: rgba(255, 255, 255, 0.3); 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }

    .dot.active {
      background: #dc2626; 
      transform: scale(1.3); 
    }

    .controls {
      position: absolute; 
      bottom: 15px; 
      right: 10px; 
      z-index: 10000; 
      display: flex; 
      flex-direction: column; 
      align-items: flex-end; 
      gap: 5px; 
    }

    .controls button {
      background-color: rgba(0,0,0,0.5); 
      color: white; 
      border: none; 
      padding: 5px 10px; 
      cursor: pointer; 
      border-radius: 3px; 
      font-weight: 600; 
      transition: background-color 0.2s ease; 
    }

    .controls button:hover {
      background-color: rgba(220, 38, 38, 0.8); 
    }

    header {
      position: fixed; 
      top: 0; 
      width: 100%; 
      z-index: 1000; 
      height: 48px; 
    }

    footer {
      position: fixed; 
      bottom: 0; 
      width: 100%; 
      z-index: 1000; 
      height: 48px; 
    }

    .ticker-wrap {
      width: 100%; 
      overflow: hidden; 
      background-color: #000; 
      box-sizing: border-box; 
      display: flex;
    }

    .ticker-content {
      display: flex; 
      width: max-content;
      white-space: nowrap; 
      animation: ticker 90s linear infinite; 
    }

    .ticker-wrap:hover .ticker-content {
      animation-play-state: paused; 
    }

    header .ticker-wrap {
      transform: skewX(-12deg); 
      margin-left: -20px; 
      width: calc(100% + 40px); 
      border-bottom: 2px solid #dc2626; 
    }

    header .ticker-item-wrapper {
      display: inline-flex; 
      transform: skewX(12deg); 
    }

    @keyframes ticker {
      0% { 
        transform: translate3d(0, 0, 0); 
      } 
      100% { 
        transform: translate3d(-50%, 0, 0); 
      } 
    }

    .ticker-item {
      display: inline-flex; 
      align-items: center; 
    }

    .progress-container {
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 5px; 
      background: rgba(255,255,255,0.2); 
      z-index: 10001; 
    }

    .progress-bar {
      height: 100%; 
      width: 0%; 
      background: #dc2626; 
    }
  </style> 
</head>

  <script> 
    let currentIndex = 0; 
    const slides = document.querySelectorAll('.slide'); 
    const dots = document.querySelectorAll('.dot'); 
    const intervalTime = 20000; 
    let slideInterval; 
    let progress = 0; 
    const progressBar = document.getElementById('progressBar'); 
    const tickRate = 100; 
    const step = (tickRate / intervalTime) * 100; 
    let progressInterval; 
    
    let isPaused = false; 
    let isMuted = true; 
    
    let mediaRecorder; 
    let recordedChunks = []; 
    let mediaStream; 
    
    const FALLBACK_X_DATA = [
      { source: "@SENTDEFENDER", headline: "Reports of air defense activity active over northern airspace; intercepts verified.", alert_level: "HIGH", primary_region: "Israel", link: "https://twi[...]
      { source: "@OSINTTECHNICAL", headline: "Imagery confirms deployment of naval strike assets in Eastern Mediterranean sectors.", alert_level: "HIGH", primary_region: "Red Sea", link: "https:/[...]
      { source: "@CONFLICT_RADAR", headline: "Joint military maneuvers observed along border checkpoints; readiness checks ongoing.", alert_level: "MEDIUM", primary_region: "Taiwan", link: "https[...]
      { source: "@POLYMARKETINTEL", headline: "Prediction indexes signal major shift in international commodity and logistics flow rates.", alert_level: "LOW", primary_region: "Global", link: "ht[...]
    ]; 
    
    const FALLBACK_STOCK_XML_STRING = ` 
    <Stocks> 
      <Stock ticker="NDAQ"><Price>19,250.45</Price><DaysChange>+1.23%</DaysChange><warming_cooling>WARMING</warming_cooling></Stock> 
      <Stock ticker="SPX"><Price>5,432.70</Price><DaysChange>+0.45%</DaysChange><warming_cooling>WARMING</warming_cooling></Stock> 
      <Stock ticker="DJIA"><Price>39,120.15</Price><DaysChange>-0.12%</DaysChange><warming_cooling>COOLING</warming_cooling></Stock> 
      <Stock ticker="BTC"><Price>$68,240.00</Price><DaysChange>+2.85%</DaysChange><warming_cooling>WARMING</warming_cooling></Stock> 
    </Stocks> `; 
    
    function updateProgress() {
      progress += step; 
      if (progressBar) progressBar.style.width = progress + "%"; 
    } 
    
    function resetProgress() {
      progress = 0; 
      if (progressBar) progressBar.style.width = "0%"; 
    } 
    
    function showSlide(index) {
      if (index >= slides.length) index = 0; 
      if (index < 0) index = slides.length - 1; 
      slides.forEach(slide => slide.classList.remove('active')); 
      dots.forEach(dot => dot.classList.remove('active')); 
      currentIndex = index; 
      slides[currentIndex].classList.add('active'); 
      if (dots[currentIndex]) dots[currentIndex].classList.add('active'); 
      resetProgress(); 
    } 
    
    function nextSlide() {
      let next = (currentIndex + 1) % slides.length; 
      showSlide(next); 
    } 
    
    function currentSlide(index) {
      showSlide(index); 
      if(!isPaused) resetTimer(); 
    } 
    
    function changeSlide(direction) {
      let next = (currentIndex + direction + slides.length) % slides.length; 
      showSlide(next); 
      if(!isPaused) resetTimer(); 
    } 
    
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        changeSlide(-1); 
      } else if (event.key === 'ArrowRight') {
        changeSlide(1); 
      } 
    });
    
    function resetTimer() {
      clearInterval(slideInterval); 
      clearInterval(progressInterval); 
      slideInterval = setInterval(nextSlide, intervalTime); 
      progressInterval = setInterval(updateProgress, tickRate); 
      const playPauseBtn = document.getElementById('playPauseBtn'); 
      if (playPauseBtn) playPauseBtn.textContent = 'Pause'; 
      isPaused = false; 
    } 
    
    function togglePlayPause() {
      isPaused = !isPaused; 
      const playPauseBtn = document.getElementById('playPauseBtn'); 
      if (isPaused) {
        clearInterval(slideInterval); 
        clearInterval(progressInterval); 
        if (playPauseBtn) playPauseBtn.textContent = 'Play'; 
      } else {
        resetTimer(); 
        if (playPauseBtn) playPauseBtn.textContent = 'Pause'; 
      } 
    } 
    
    function toggleMute() {
      isMuted = !isMuted; 
      const muteBtn = document.getElementById('muteBtn'); 
      if (muteBtn) muteBtn.textContent = isMuted ? 'Unmute' : 'Mute'; 
    } 
    
    function toggleFullscreen() {
      const elem = document.querySelector('.slide.active'); 
      if (elem) { elem.classList.toggle('fake-fullscreen'); } 
    } 
    
    async function startRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({video: { mediaSource: "screen" } }); 
        recordedChunks = []; 
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' }); 
        mediaRecorder.ondataavailable = event => { if (event.data.size > 0) { recordedChunks.push(event.data); } }; 
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' }); 
          const url = URL.createObjectURL(blob); 
          const a = document.createElement('a'); 
          a.href = url; 
          a.download = 'recording.webm'; 
          document.body.appendChild(a); 
          a.click(); 
          URL.revokeObjectURL(url); 
          document.body.removeChild(a); 
        }; 
        mediaRecorder.start(); 
        document.getElementById('startRecordBtn').style.display = 'none'; 
        document.getElementById('stopRecordBtn').style.display = ''; 
      } catch (err) { console.error("Error starting recording:", err); } 
    } 
    
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); } 
      if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); } 
      document.getElementById('startRecordBtn').style.display = ''; 
      document.getElementById('stopRecordBtn').style.display = 'none'; 
    } 
    
    const headerRssUrls = [
      'https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/x_news.json',
      'https://api.allorigins.win/get?url=https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/x_news.json'
    ];
    const footerRssUrls = [
      'https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/Stock%20Watch.xml',
      'https://api.allorigins.win/get?url=https://raw.githubusercontent.com/AndrewsIndustries/AndrewsIndustries/main/data/Stock%20Watch.xml'
    ];
    
    function seedTickersWithFallbacks() {
      const headerItems = FALLBACK_X_DATA.map(entry => {
        const sourceLabel = entry.source; 
        const region = entry.primary_region ? ` [${entry.primary_region}]` : ''; 
        const badgeClass = 'bg-slate-800 border-slate-700 text-slate-300'; 
        const link = entry.link || '#'; 
        return `<a href="${link}" target="_blank" class="mx-16 ticker-item-wrapper items-center no-underline hover:opacity-80 transition-opacity"> <span class="px-3 py-1 rounded-md border ${badge[...]
      }); 
      renderTickerHtml('news-ticker', headerItems); 
      
      const parser = new DOMParser(); 
      const xmlDoc = parser.parseFromString(FALLBACK_STOCK_XML_STRING, "text/xml"); 
      const footerItems = parseXmlData(xmlDoc, false); 
      renderTickerHtml('footer-ticker', footerItems); 
    } 
    
    function renderTickerHtml(elementId, itemsArray) {
      const tickerElement = document.getElementById(elementId); 
      if (!tickerElement || !itemsArray.length) return; 
      const tickerHtml = itemsArray.join(' <span class="text-slate-600 text-3xl"> | </span> '); 
      tickerElement.innerHTML = tickerHtml + ' <span class="text-slate-600 text-3xl"> | </span> ' + tickerHtml; 
      tickerElement.style.animation = 'none'; 
      tickerElement.offsetHeight; 
      tickerElement.style.animation = ''; 
      const isHeader = (elementId === 'news-ticker'); 
      const speedMultiplier = isHeader ? 15 : 8; 
      const minDuration = isHeader ? 45 : 40; 
      tickerElement.style.animationDuration = Math.max(minDuration, (itemsArray.length || 1) * speedMultiplier) + 's'; 
    } 
    
    async function updateTicker(urls, elementId) {
      const tickerElement = document.getElementById(elementId); 
      if (!tickerElement) return; 
      try {
        let allTitles = []; 
        const parser = new DOMParser(); 
        for (const url of urls) {
          const cleanUrl = url.trim(); 
          let proxyUrls = []; 
          if (cleanUrl.startsWith('https://raw.githubusercontent.com')) {
            proxyUrls = [`${cleanUrl}?t=${Date.now()}`, `https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl + '?t=' + Date.now())}` ]; 
          } else if (cleanUrl.startsWith('http')) {
            proxyUrls = [`https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl)}&_=${Date.now()}`, `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(cleanUrl)}` ]; 
          } else {
            proxyUrls = [cleanUrl]; 
          } 
          for (const proxyUrl of proxyUrls) {
            try {
              const controller = new AbortController(); 
              const timeoutId = setTimeout(() => controller.abort(), 4000); 
              const response = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' }); 
              clearTimeout(timeoutId); 
              if (!response.ok) continue; 
              let responseText; 
              if (proxyUrl.includes('allorigins.win')) {
                try {
                  const data = await response.json(); 
                  responseText = data.contents; 
                } catch (e) { continue; } 
              } else {
                responseText = await response.text(); 
              } 
              if (!responseText || responseText.trim() === "") continue; 
              const trimmed = responseText.trim(); 
              const isHeader = elementId === 'news-ticker'; 
              
              if (trimmed.startsWith('[') || (trimmed.startsWith('{') && !trimmed.includes('"error":'))) {
                const titles = parseJsonX(trimmed, isHeader); 
                if (titles.length) { allTitles.push(...titles); break; } 
              } 
              if (cleanUrl.toLowerCase().includes('output=csv')) {
                const titles = parseCsvData(trimmed); 
                if (titles.length) { allTitles.push(...titles); break; } 
              } 
              if (trimmed.startsWith('<')) {
                const xmlDoc = parser.parseFromString(responseText, "text/xml"); 
                if (xmlDoc.getElementsByTagName("parsererror").length > 0) continue; 
                const titles = parseXmlData(xmlDoc, isHeader); 
                if (titles.length) { allTitles.push(...titles); break; } 
              } 
            } catch (err) { console.warn(`Attempt failed for ${url} on proxy:`, err); } 
          } 
          if (allTitles.length) break; 
        } 
        if (allTitles.length > 0) { renderTickerHtml(elementId, allTitles); } 
      } catch (error) { console.error(`Error updating ${elementId}:`, error); } 
    } 
    
    function formatSourceLabel(name) {
      let s = (name || '').trim().toUpperCase(); 
      if (s.startsWith('@')) return s; 
      const handleMatch = s.match(/@([A-Z0-9_]+)/i); 
      if (handleMatch) return `@${handleMatch[1]}`; 
      return s || "NEWS"; 
    } 
    
    function parseJsonX(text, isHeader = false) {
      try {
        let data = JSON.parse(text); 
        if (!Array.isArray(data)) {
          if (data.news && Array.isArray(data.news)) data = data.news; 
          else if (data.alerts && Array.isArray(data.alerts)) data = data.alerts; 
          else if (data.headline || data.title) data = [data]; 
          else return []; 
        } 
        return data.map(entry => {
          const sourceLabel = formatSourceLabel(entry.source); 
          const region = entry.primary_region ? ` [${entry.primary_region}]` : ''; 
          const badgeClass = 'bg-slate-800 border-slate-700 text-slate-300'; 
          const wrapperClass = isHeader ? 'ticker-item-wrapper' : 'inline-flex'; 
          const link = entry.link || '#'; 
          return `<a href="${link}" target="_blank" class="mx-16 ${wrapperClass} items-center no-underline hover:opacity-80 transition-opacity"> <span class="px-3 py-1 rounded-md border ${badgeCl[...]
        }); 
      } catch (e) { return []; } 
    } 
    
    function parseCsvData(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== ""); 
      if (lines.length <= 1) return []; 
      lines.shift(); 
      return lines.map(line => {
        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/g).map(cell => cell.trim().replace(/^"(.*)"$/, '$1')); 
        if (cols[0] && cols[1]) {
          const price = parseFloat(cols[1].replace(/[^0-9.-]+/g, "") || 0).toFixed(2); 
          return `<span class="mx-16 inline-flex items-center"> <span class="px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400 font-black text-xs mr-3 tracking-widest">SHEET[...]
        } 
        return null; 
      }).filter(x => x); 
    } 
    
    function parseXmlData(xmlDoc, isHeader = false) {
      const allTitles = []; 
      const rawTitleEl = xmlDoc.querySelector("channel > title, feed > title, Organization"); 
      const feedLabel = formatSourceLabel(rawTitleEl ? rawTitleEl.textContent : "NEWS"); 
      const wrapperClass = isHeader ? 'ticker-item-wrapper' : 'inline-flex'; 
      const items = xmlDoc.querySelectorAll("item, entry, Stock, stock"); 
      items.forEach(item => {
        if (item.tagName.toUpperCase() === 'STOCK') {
          const ticker = item.getAttribute('ticker') || 'N/A'; 
          const price = item.querySelector('Price')?.textContent || 'N/A'; 
          const change = item.querySelector('DaysChange')?.textContent || '0%'; 
          const status = (item.querySelector('warming_cooling')?.textContent || 'N/A').toUpperCase(); 
          const statusBg = status === 'WARMING' ? 'bg-green-900/40 border-green-700 text-green-400' : status === 'COOLING' ? 'bg-red-900/40 border-red-700 text-red-400' : 'bg-slate-900 border-sla[...]
          allTitles.push(`<span class="mx-16 ${wrapperClass} items-center"> <span class="font-black text-white text-4xl mr-3">${ticker}</span> <span class="text-slate-400 text-2xl mr-3">${price}<[...]
        } else {
          const title = item.querySelector("title")?.textContent; 
          const link = item.querySelector("link")?.textContent || item.querySelector("guid")?.textContent || "#"; 
          if (title) {
            const badgeClass = 'bg-slate-800 border-slate-700 text-slate-300'; 
            allTitles.push(`<a href="${link}" target="_blank" class="mx-16 ${wrapperClass} items-center no-underline hover:opacity-80 transition-opacity"> <span class="px-3 py-1 rounded-md border[...]
          } 
        } 
      }); 
      return allTitles; 
    } 
    
    async function fetchNews() {
      updateTicker(headerRssUrls, 'news-ticker'); 
      updateTicker(footerRssUrls, 'footer-ticker'); 
    } 
    
    function init() {
      if(document.getElementById('playPauseBtn')) document.getElementById('playPauseBtn').onclick = togglePlayPause; 
      if(document.getElementById('muteBtn')) document.getElementById('muteBtn').onclick = toggleMute; 
      if(document.getElementById('fullscreenBtn')) document.getElementById('fullscreenBtn').onclick = toggleFullscreen; 
      if(document.getElementById('refreshBtn')) document.getElementById('refreshBtn').onclick = () => location.reload(); 
      if(document.getElementById('startRecordBtn')) document.getElementById('startRecordBtn').onclick = startRecording; 
      if(document.getElementById('stopRecordBtn')) document.getElementById('stopRecordBtn').onclick = stopRecording; 
      slides.forEach(slide => { slide.addEventListener('dblclick', () => { toggleFullscreen(); }); }); 
      seedTickersWithFallbacks(); 
      fetchNews(); 
      showSlide(0); 
      resetTimer(); 
    } 
    
    init(); 
    
    setInterval(function() {
      fetchNews(); 
      const iframes = document.querySelectorAll('iframe[src*="docs.google.com/spreadsheets"]'); 
      iframes.forEach(iframe => {
        let src = iframe.src.split('?')[0]; 
        let params = new URLSearchParams(iframe.src.split('?')[1] || ''); 
        params.delete('_cache_bust'); 
        src += '?' + params.toString() + '&_cache_bust=' + new Date().getTime(); 
        iframe.src = src; 
      }); 
    }, 60000); 
  </script> 
</body>
