    <script>
 let currentIndex = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const intervalTime = 20000; // 20 Seconds
let slideInterval;
let progress = 0;
const progressBar = document.getElementById('progressBar');
const tickRate = 100; // Update every 100ms
const step = (tickRate / intervalTime) * 100; // How much % to add each tick
let progressInterval;

// New state variables
let isPaused = false;
let isMuted = true; // Videos start muted

// --- Recording variables ---
let mediaRecorder;
let recordedChunks = [];
let mediaStream;


function updateProgress() {
    progress += step;
    progressBar.style.width = progress + "%";

    if (progress >= 100) {
        // This will be reset by showSlide, which is triggered by nextSlide
    }
}

function resetProgress() {
    progress = 0;
    progressBar.style.width = "0%";
}

function showSlide(index) {
    // Safety check for index out of bounds
    if (index >= slides.length) index = 0;
    if (index < 0) index = slides.length - 1;

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));
    
    document.querySelectorAll('video').forEach(v => v.pause());

    currentIndex = index;
    slides[currentIndex].classList.add('active');
    dots[currentIndex].classList.add('active');
    
    const currentVideo = slides[currentIndex].querySelector('video');
    if (currentVideo) {
        currentVideo.muted = isMuted;
        currentVideo.currentTime = 0;
        currentVideo.play().catch(e => console.error("Video play failed:", e));
    }
    
    resetProgress();
}

function nextSlide() {
    let next = (currentIndex + 1) % slides.length;
    showSlide(next);
}

function currentSlide(index) {
    showSlide(index);
    if(!isPaused) resetTimer();
}

function changeSlide(direction) {
    let next = (currentIndex + direction + slides.length) % slides.length;
    showSlide(next);
    if(!isPaused) resetTimer();
}

function resetTimer() {
    clearInterval(slideInterval);
    clearInterval(progressInterval);
    slideInterval = setInterval(nextSlide, intervalTime);
    progressInterval = setInterval(updateProgress, tickRate);
    
    const playPauseBtn = document.getElementById('playPauseBtn');
    if (playPauseBtn) playPauseBtn.textContent = 'Pause';
    isPaused = false;
}

// --- Control Functions ---

function togglePlayPause() {
    isPaused = !isPaused;
    const playPauseBtn = document.getElementById('playPauseBtn');

    if (isPaused) {
        clearInterval(slideInterval);
        clearInterval(progressInterval);
        playPauseBtn.textContent = 'Play';
    } else {
        resetTimer();
        playPauseBtn.textContent = 'Pause';
    }
}

function toggleMute() {
    isMuted = !isMuted;
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    document.querySelectorAll('video').forEach(v => {
        v.muted = isMuted;
    });
}

function toggleFullscreen() {
  const elem = document.querySelector('.slide.active');
  if (elem) {
    elem.classList.toggle('fake-fullscreen');
  }
}

// --- Recording Functions ---

async function startRecording() {
    try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" }
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recording.webm';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        };

        mediaRecorder.start();
        document.getElementById('startRecordBtn').style.display = 'none';
        document.getElementById('stopRecordBtn').style.display = '';

    } catch (err) {
        console.error("Error starting recording:", err);
        alert("Could not start recording. Please ensure you grant permission and your browser supports screen recording.");
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('startRecordBtn').style.display = '';
    document.getElementById('stopRecordBtn').style.display = 'none';
}


// --- Event Listeners ---

document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {
        changeSlide(-1);
    } else if (event.key === 'ArrowRight') {
        changeSlide(1);
    }
});


window.onload = () => {
    // Hook up buttons
    document.getElementById('playPauseBtn').onclick = togglePlayPause;
    document.getElementById('muteBtn').onclick = toggleMute;
    document.getElementById('fullscreenBtn').onclick = toggleFullscreen;
    document.getElementById('refreshBtn').onclick = () => location.reload();
    document.getElementById('startRecordBtn').onclick = startRecording;
    document.getElementById('stopRecordBtn').onclick = stopRecording;

    slides.forEach(slide => {
        slide.addEventListener('dblclick', () => {
            toggleFullscreen();
        });
    });

    showSlide(0);
    resetTimer();
};

</script>

  setInterval(function() {

      src += '?' + params.toString() + '&_cache_bust=' + new Date().getTime();
      iframe.src = src;
    }
  }, 60000); // 60000ms = 1 minute000ms = 1 minute
</script>
