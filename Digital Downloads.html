<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrews Industries | Digital Downloads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .download-card:hover { transform: translateY(-5px); transition: all 0.3s ease; border-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="glass-card flex items-center justify-between px-8 py-6 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-cloud-arrow-down text-blue-500 text-3xl"></i>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Digital Assets</h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest">Andrews Industries Repository</p>
            </div>
        </div>
        <div class="flex gap-4">
            <button id="syncBtn" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                <i class="fa-solid fa-sync"></i> Refresh Data
            </button>
        </div>
    </header>

    <main class="flex-1 p-8 max-w-7xl mx-auto w-full">
        <div id="loading" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
            <p class="text-slate-400">Loading catalog...</p>
        </div>

        <div id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Items injected by JS -->
        </div>
    </main>

    <footer class="p-8 text-center text-slate-500 text-sm border-t border-slate-800">
        <p>&copy; 2024 Andrews Industries. All assets are synced daily.</p>
    </footer>

    <script>
        const XML_PATH = 'data/Digital_Downloads.xml';
        const REPO = 'AndrewsIndustries/AndrewsIndustries';
        const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/${XML_PATH}`;

        async function loadCatalog() {
            try {
                let response;
                try {
                    // Try fetching from the relative path first
                    response = await fetch(`${XML_PATH}?t=${Date.now()}`);
                    if (!response.ok) throw new Error();
                } catch (e) {
                    // Fallback to absolute GitHub Raw URL (fixes local testing and CORS issues)
                    response = await fetch(`${RAW_URL}?t=${Date.now()}`);
                }

                if (!response.ok) {
                    throw new Error(`Data file not found (404).<br><br>
                    <span class="text-sm font-normal text-slate-400">
                    1. Ensure the 'Sync Digital Downloads' Action has run in GitHub.<br>
                    2. Check that 'data/Digital_Downloads.xml' exists in your repo.<br>
                    3. If testing locally, ensure you are connected to the internet.
                    </span>`);
                }
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const items = xmlDoc.getElementsByTagName("Item");
                const grid = document.getElementById('catalogGrid');
                const loading = document.getElementById('loading');
                
                grid.innerHTML = '';

                if (items.length === 0) {
                    loading.innerHTML = `
                        <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-4"></i>
                        <p class="text-slate-400">The catalog is currently empty.</p>
                        <p class="text-xs text-slate-500 mt-2">Add items to your Google Sheet and click 'Refresh Data'.</p>
                    `;
                    return;
                }

                Array.from(items).forEach(item => {
                    const name = item.getElementsByTagName("Name")[0]?.textContent || "Unnamed Asset";
                    const price = item.getElementsByTagName("Price")[0]?.textContent || "Free";
                    const link = item.getElementsByTagName("Link")[0]?.textContent || "#";

                    const card = document.createElement('div');
                    card.className = 'glass-card download-card p-6 rounded-2xl flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="w-12 h-12 bg-blue-500/10 rounded-xl flex items-center justify-center mb-4">
                                <i class="fa-solid fa-file-zipper text-blue-400 text-xl"></i>
                            </div>
                            <h3 class="text-xl font-bold mb-1">${name}</h3>
                            <p class="text-blue-400 font-mono text-sm font-semibold mb-6">${price}</p>
                        </div>
                        <a href="${link}" target="_blank" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-center font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-download text-xs"></i> Download Now
                        </a>
                    `;
                    grid.appendChild(card);
                });

                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (err) {
                document.getElementById('loading').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-4"></i>
                    <p class="text-red-400 font-bold uppercase tracking-tight">Load Failure</p>
                    <p class="text-slate-400 mt-2 px-10">${err.message}</p>
                    <button onclick="location.reload()" class="mt-4 text-blue-400 underline">Retry</button>
                `;
            }
        }

        async function triggerSync() {
            const btn = document.getElementById('syncBtn');
            let token = localStorage.getItem('andrews_gh_pat');
            
            if (!token) {
                token = prompt("Please enter your GitHub PAT to trigger a manual sync:");
                if (!token) return;
                localStorage.setItem('andrews_gh_pat', token);
            }

            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Triggering...';

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ event_type: 'sync_downloads' })
                });

                if (response.ok) {
                    alert("Sync triggered successfully! GitHub is updating the catalog. Please wait 1-2 minutes and refresh.");
                } else {
                    const data = await response.json();
                    throw new Error(data.message || "Unknown error");
                }
            } catch (err) {
                alert(`Failed to trigger sync: ${err.message}`);
                if (err.message.includes("401")) localStorage.removeItem('andrews_gh_pat');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        document.getElementById('syncBtn').addEventListener('click', triggerSync);
        window.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>
</html>
