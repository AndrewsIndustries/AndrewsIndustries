name: Update Stock Watch XML

on:
  repository_dispatch:
    types: [update-xml]

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update XML File
        run: |
          mkdir -p data
          echo "${{ github.event.client_payload.xml_content }}" > data/Stock\ Watch.xml

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/Stock\ Watch.xml
          git commit -m "Update Stock Watch XML from Dashboard" || echo "No changes to commit"
          git push