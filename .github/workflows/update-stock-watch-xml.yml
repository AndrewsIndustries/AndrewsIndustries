name: Update Stock Watch XML

on:
  schedule:
    - cron: '0 * * * *' # Automate: Runs every hour
  repository_dispatch:
    types: [update-xml]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update_xml_file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant write permission to the GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the GITHUB_TOKEN provided by GitHub Actions for authentication
          # This token has write permissions because of the 'permissions' block above
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update Stock Data
        env:
          XML_PAYLOAD: ${{ github.event.client_payload.xml_content }}
        run: |
          mkdir -p data/
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "$XML_PAYLOAD" | sed 's/\\n/\n/g' > "data/Stock Watch.xml"
          else
            python process_stocks.py
          fi

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add "data/Stock Watch.xml"
          git diff --staged --quiet || git commit -m "Update Stock Watch.xml via GitHub Action"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use the automatically provided token