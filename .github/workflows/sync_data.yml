name: Automated Data Sync

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:       # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests feedparser

      - name: Execute sync scripts
        run: |
          python sync_stocks.py
          python sync_X_news.py
          python sync_digital_downloads.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "Andrews-Sync-Bot"
          git config --global user.email "actions@github.com"
          git add data/*.xml data/*.json

          if ! git diff --staged --quiet; then
            git commit -m "Automated Sync: $(date)"

            for attempt in 1 2 3; do
              if ! git fetch origin main; then
                echo "Failed to fetch origin/main."
                exit 1
              fi

              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict while updating from origin/main; rebase aborted."
                exit 1
              fi

              if git push origin HEAD:main; then
                exit 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "Push attempt $attempt failed; retrying in 5 seconds."
                sleep 5
              fi
            done

            echo "Push failed after 3 attempts."
            exit 1
          fi
