name: Automated Data Sync

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:       # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas requests feedparser

      - name: Execute sync scripts
        run: |
          python sync_stocks.py
          python sync_X_news.py
          python sync_digital_downloads.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "Andrews-Sync-Bot"
          git config --global user.email "actions@github.com"
          git add data/*.xml data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: $(date)" && git push)