<body>

<div class="slider-container">
    <div class="slider">

        <div class="slide">
            <video src="https://iran.liveuamap.com/" muted loop playsinline></video>
        </div>

        <div class="slide">
            <video src="https://d2wse2.its.nv.gov:443/renoxcd03/16f5a6d0-80a8-4771-a534-6e1bc7ee44b0_hspflirxcd03_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>

        <div class="slide">
            <video src="https://d2wse1.its.nv.gov:443/renoxcd01/df61860e-6739-4d2e-b346-a4242ffd56d5_hspflirxcd01_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>

        <div class="slide">
            <video src="https://d2wse2.its.nv.gov:443/renoxcd02/66939df9-550e-48cc-93e8-186d789fc3ad_hspflirxcd02_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>

        <div class="slide">
            <video src="https://d2wse1.its.nv.gov:443/renoxcd01/c3ae62a5-f5fa-4684-8c65-7cd676f27e32_hspflirxcd01_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>
    
        <div class="slide">
            <video src="https://d2wse2.its.nv.gov:443/renoxcd02/49552511-8296-4a39-ac95-e7c817a2cfc0_hspflirxcd02_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>

        <div class="slide">
            <video src="https://d2wse1.its.nv.gov:443/renoxcd01/fbafdf3c-454d-40b7-a000-801b4c5518da_hspflirxcd01_public.stream/playlist.m3u8" muted loop playsinline></video>
        </div>


    </div>

    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>

    <div class="dots">
        <span class="dot active" onclick="currentSlide(0)"></span>
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
        <span class="dot" onclick="currentSlide(5)"></span>
        <span class="dot" onclick="currentSlide(6)"></span>
        <span class="dot" onclick="currentSlide(7)"></span>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>


</body>




<script>
let currentIndex = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');
const intervalTime = 20000; // 20 Seconds
let slideInterval;
let progress = 0;
const progressBar = document.getElementById('progressBar');
const tickRate = 100; // Update every 100ms
const step = (tickRate / intervalTime) * 100; // How much % to add each tick
let progressInterval;

function updateProgress() {
    progress += step;
    progressBar.style.width = progress + "%";

    if (progress >= 100) {
        resetProgress();
    }
}

function resetProgress() {
    progress = 0;
    progressBar.style.width = "0%";
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(updateProgress, tickRate);
}

function showSlide(index) {
    // Remove active class from all
    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));
    
    // Pause all videos
    document.querySelectorAll('video').forEach(v => v.pause());

    // Activate selected slide
    currentIndex = index;
    slides[currentIndex].classList.add('active');
    dots[currentIndex].classList.add('active');
    
    // Play the current video
    const currentVideo = slides[currentIndex].querySelector('video');
    if (currentVideo) {
        currentVideo.currentTime = 0;
        currentVideo.play().catch(e => console.error("Video play failed:", e));
    }
    
    resetProgress();
}

function nextSlide() {
    let next = (currentIndex + 1) % slides.length;
    showSlide(next);
}

// Manual Navigation
function currentSlide(index) {
    showSlide(index);
    resetTimer();
}

function changeSlide(direction) {
    let next = (currentIndex + direction + slides.length) % slides.length;
    showSlide(next);
    resetTimer(); // Restarts the 20s countdown
}

// Auto-play Timer
function resetTimer() {
    clearInterval(slideInterval);
    slideInterval = setInterval(nextSlide, intervalTime);
}

// Initialize first video
window.onload = () => {
    showSlide(0);
    resetTimer();
};

</script>
