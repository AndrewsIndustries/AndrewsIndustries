<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrews Industries | Stock Watch Pro v2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Added SheetJS for reliable Excel/Watchlist parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            background-size: cover;
            background-position: center;
            /* Uncomment and set your image path to restore background image */
            /* background-image: url('images/Backgrounds/vintage.avif'); */
            color: #f8fafc; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); 
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Ticker Animation */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #000;
            box-sizing: border-box;
            border-top: 1px solid #333;
        }
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 2px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="glass-card flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-chart-line text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">Andrews Industries <span class="text-blue-500">| Stock Watch Pro</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="exportBtn" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-semibold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-file-export"></i> Download XML
            </button>
            <button id="syncBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition-colors flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> Sync Now
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Controls -->
        <aside class="w-80 glass-card p-4 overflow-y-auto flex flex-col gap-6 border-r border-slate-700">
            <!-- GitHub Integration -->
            <div class="mt-4">
                <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider mb-2"><i class="fa-brands fa-github mr-2"></i>GitHub Integration</h2>
                <p class="text-[10px] text-slate-500 mb-2">Target: data/Stock Watch.xml</p>
                <input type="text" id="ghRepo" value="AndrewsIndustries/AndrewsIndustries" placeholder="username/repository" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-white mb-2">
                <button id="pushBtn" class="w-full bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm font-semibold transition-colors flex items-center justify-center gap-2 mb-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Push XML to Repo
                </button>
                <button id="resetTokenBtn" class="w-full text-xs text-slate-400 hover:text-white underline text-center">
                    Reset Access Token
                </button>
            </div>
        </aside>

        <!-- Data Table -->
        <section class="flex-1 p-6 overflow-y-auto">
            <div class="glass-card rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/50 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-700">
                            <th class="p-4 font-medium">Ticker</th>
                            <th class="p-4 font-medium text-center">Price</th>
                            <th class="p-4 font-medium text-center">Days Return</th>
                            <th class="p-4 font-medium text-center">WARMING OR COOLING</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="text-sm divide-y divide-slate-800/50">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Footer Ticker -->
    <footer class="ticker-wrap h-12 flex items-center shadow-lg z-50">
        <div id="tickerContent" class="ticker-content text-green-400 text-lg tracking-wide font-medium">
            Waiting for data...
        </div>
    </footer>

    <script>
        // Using the XLSX endpoint to specifically target the 'watchlist' sheet
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQYftjQ9fHLfDzmWIZ7QFdW0SplgDJPVpaaHKirmWkOERgEMNSr2yPcwXUNKRnxSwFRPTTQf8maQjs/pub?output=xlsx';

        let analyzedResults = [];
        let currentXML = '';

        // Event Listeners
        document.getElementById('exportBtn').addEventListener('click', downloadXML);
        document.getElementById('pushBtn').addEventListener('click', pushToGitHub);
        document.getElementById('syncBtn').addEventListener('click', fetchAndProcess);
        document.getElementById('resetTokenBtn').addEventListener('click', resetToken);

        async function fetchAndProcess() {
            try {
                const tickerDiv = document.getElementById('tickerContent');
                tickerDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Syncing with Google Sheets...';
                
                let arrayBuffer;
                try {
                    const response = await fetch(`${SHEET_URL}&cache_bust=${Date.now()}`);
                    if (response.ok) {
                        arrayBuffer = await response.arrayBuffer();
                    }
                } catch (e) {
                    console.warn("Direct fetch blocked by browser security (CORS), trying proxy...");
                }

                if (!arrayBuffer) {
                    // Use AllOrigins /raw endpoint for direct binary streaming of XLSX
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(SHEET_URL + '&cache_bust=' + Date.now())}`;
                    const proxyRes = await fetch(proxyUrl);
                    if (!proxyRes.ok) throw new Error(`Proxy failed (${proxyRes.status}). Try disabling ad-blockers.`);
                    arrayBuffer = await proxyRes.arrayBuffer();
                }

                if (!arrayBuffer) throw new Error("No data received from source");
                
                processData(arrayBuffer);
            } catch (err) {
                console.error("Fetch failed:", err);
                document.getElementById('tickerContent').innerHTML = 
                    `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Sync Failed: ${err.message === 'Failed to fetch' ? 'Connection Blocked (CORS/Ad-blocker)' : err.message}</span>`;
            }
        }

        // Core Logic
        function processData(buffer) {
            const workbook = XLSX.read(buffer, { type: 'array' });
            
            // Specifically jump to 'watchlist' sheet, or fallback to the first sheet
            const sheetName = workbook.SheetNames.find(n => n.toLowerCase() === 'watchlist') || workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            
            // Convert sheet to array of arrays (header is row 0)
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
            
            analyzedResults = [];

            if (rows.length < 2) {
                document.getElementById('tickerContent').innerHTML = 
                    `<i class="fa-solid fa-circle-exclamation mr-2"></i> Error: Sheet "${sheetName}" is empty or missing headers.`;
                renderTable();
                return;
            }

            const headers = rows[0].map(h => String(h).trim().toUpperCase());
            const statusColIdx = headers.findIndex(h => h.toUpperCase() === 'WARMING OR COOLING');
            const targetIdx = statusColIdx !== -1 ? statusColIdx : 19; // Fallback to index 19 if header name mismatch

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row[0]) continue; // Skip empty tickers

                const ticker = row[0];
                const daysReturn = row[5];
                const price = row[2] ;
                const warmingCooling = row[19]; 

                analyzedResults.push({
                    ticker: ticker,
                    price: price,
                    daysChange: daysReturn,
                    valT: warmingCooling
                });
            }
            
            if (analyzedResults.length === 0) {
                document.getElementById('tickerContent').innerHTML = "CSV loaded, but no valid stock entries were found.";
                renderTable();
                return;
            }

            renderTable();
            updateTicker();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            analyzedResults.forEach(s => {
                const status = s.valT.toUpperCase();
                const statusColor = status === 'WARMING' ? 'text-green-400 font-bold' : 
                                   status === 'COOLING' ? 'text-red-400 font-bold' : 'text-white';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold tracking-wide">${s.ticker}</td>
                    <td class="p-4 text-center text-slate-300">${s.price}</td>
                    <td class="p-4 text-center text-slate-400">${s.daysChange}</td>
                    <td class="p-4 text-center font-mono ${statusColor}">${s.valT}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateTicker() {
            const tickerDiv = document.getElementById('tickerContent');
            let tickerHtml = analyzedResults.map(s => {
                const status = s.valT.toUpperCase();
                const statusBg = status === 'WARMING' ? 'bg-green-900/40 border-green-700 text-green-400' : 
                                 status === 'COOLING' ? 'bg-red-900/40 border-red-700 text-red-400' : 
                                 'bg-slate-900 border-slate-700 text-white';

                return `<span class="mx-16 inline-flex items-center">
                    <span class="font-black text-white text-3xl mr-3">${s.ticker}</span> 
                    <span class="text-slate-400 text-xl mr-3">${s.price}</span> 
                    <span class="text-white text-xl mr-4">${s.daysChange}</span> 
                    <span class="px-4 py-1 rounded border font-mono ${statusBg}">
                        ${s.valT}
                    </span> 
                </span>`;
            }).join(' <span class="text-slate-600">|</span> ');
            
            // Duplicate content to ensure smooth marquee looping
            tickerDiv.innerHTML = tickerHtml + ' <span class="text-slate-600">|</span> ' + tickerHtml;
        }

        // XML Report Generation
        function getXMLString() {
            let xml = `<StockWatchReport>\n`;
            xml += `  <Header>\n`;
            xml += `    <Organization>Andrews Industries</Organization>\n`;
            xml += `    <Generated>${new Date().toISOString()}</Generated>\n`;
            xml += `    <Count>${analyzedResults.length}</Count>\n`;
            xml += `  </Header>\n`;
            xml += `  <MarketData>\n`;
            analyzedResults.forEach(s => {
                xml += `    <Stock ticker="${s.ticker}">\n`;
                xml += `      <Price>${s.price}</Price>\n`;
                xml += `      <DaysChange>${s.daysChange}</DaysChange>\n`;
                xml += `      <warming_cooling>${s.valT}</warming_cooling>\n`;
                xml += `    </Stock>\n`;
            });
            xml += `  </MarketData>\n</StockWatchReport>`;
            return xml;
        }

        function downloadXML() {
            if (analyzedResults.length === 0) return alert("Please process data first.");
            const xml = getXMLString();
            const blob = new Blob([xml], { type: 'application/xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Stock Watch.xml`;
            a.click();
        }

        // GitHub Actions Integration
        async function pushToGitHub() {
            if (analyzedResults.length === 0) return alert("Please process data first.");
            const repo = document.getElementById('ghRepo').value.trim();
            if (!repo || !repo.includes('/')) return alert("Please enter a valid GitHub repository (e.g., username/repo).");

            let token = localStorage.getItem('andrews_gh_pat');
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token (Requires repo contents access):");
                if (!token) return;
                localStorage.setItem('andrews_gh_pat', token);
            }

            const xml = getXMLString();
            const pushBtn = document.getElementById('pushBtn');
            pushBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Pushing...';

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'update-xml',
                        client_payload: { xml_content: xml }
                    })
                });

                if (response.ok) {
                    alert('Successfully triggered GitHub Action! XML has been dispatched.');
                } else {
                    const err = await response.text();
                    alert('Failed to trigger GitHub Action: ' + err);
                }
            } catch (error) {
                alert('Error pushing to GitHub: ' + error.message);
            } finally {
                pushBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Push XML to Repo';
            }
        }

        function resetToken() {
            localStorage.removeItem('andrews_gh_pat');
            alert("GitHub Token cleared. You will be prompted for a new one on your next push.");
        }

        // Initialize on Load
        window.addEventListener('load', () => {
            fetchAndProcess();
        });

    </script>
</body>
</html>
