<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Watch</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
<div class="container">
    <h1>Live Weather <span class="live-indicator">Live</span></h1>
    
    <div class="data-grid">
        <div class="data-card full-width">
            <label>Current Location</label>
            <value id="location">Detecting...</value>
        </div>
        <div class="data-card">
            <label>Temperature</label>
            <value id="temp">--</value>
        </div>
        <div class="data-card">
            <label>Conditions</label>
            <value id="conditions">--</value>
        </div>
        <div class="data-card">
            <label>Wind</label>
            <value id="wind">--</value>
        </div>
        <div class="data-card">
            <label>Humidity</label>
            <value id="humidity">--</value>
        </div>
        <div class="data-card">
            <label>Pressure</label>
            <value id="pressure">--</value>
        </div>
        <div class="data-card">
            <label>Solar Wind</label>
            <value id="solar-wind">--</value>
        </div>
        <div class="data-card full-width">
            <label>Forecast Short</label>
            <value id="forecast" style="font-size: 1rem; font-weight: normal;">--</value>
        </div>
    </div>

    <div class="module-grid">
        <div class="section-box">
            <h2>Local Radar</h2>
            <div class="radar-container">
                <iframe width="100%" height="100%" src="https://radar.weather.gov/ridge/standard/KRGX_0.gif" frameborder="0"></iframe>
            </div>
        </div>
        
        <div class="section-box">
            <h2>Sun & Space Weather</h2>
            <div class="data-grid">
                <div class="data-card"><label>Sunrise</label><value id="sunrise">--</value></div>
                <div class="data-card"><label>Sunset</label><value id="sunset">--</value></div>
                <div class="data-card"><label>Planetary Kp</label><value id="kp-index">--</value></div>
                <div class="data-card"><label>Traffic Cam</label>
                    <img id="webcam" src="https://nvroads.com/map/CCTV/714--7" style="width:100%; border-radius:4px; margin-top:5px;">
                </div>
            </div>
        </div>
    </div>

    <div class="module-grid" style="grid-template-columns: 1fr;">
        <div class="section-box">
            <h2>Hourly Look-Ahead</h2>
            <div id="hourly-wrap" class="horizontal-scroll">
                <div class="status">Loading hourly data...</div>
            </div>
        </div>

        <div class="section-box">
            <h2>7-Day Forecast</h2>
            <div id="daily-wrap" class="horizontal-scroll">
                <div class="status">Loading 7-day data...</div>
            </div>
        </div>
    </div>

    <button onclick="getWeather()">Refresh Data</button>
    <div class="status" id="timestamp">Initializing...</div>
</div>
<script>
    // Coordinates for Carson City / Dayton Area
    const LAT = 39.1638;
    const LON = -119.7674;
    
    async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Fetch failed for ${url}`);
        return res.json();
    }

    async function getWeather() {
        document.getElementById('timestamp').innerText = "Fetching live data...";
        try {
            // Step 1: Get NWS grid points for the coordinates
            const pointsResponse = await fetch(`https://api.weather.gov/points/${LAT},${LON}`);
            if (!pointsResponse.ok) throw new Error('Location lookup failed');
            const pointsData = await pointsResponse.json();
            
            // Get city/state info from metadata
            const city = pointsData.properties.relativeLocation.properties.city;
            const state = pointsData.properties.relativeLocation.properties.state;
            document.getElementById('location').innerText = `${city}, ${state} 89702`;

            // Step 2: Parallel Fetch Forecasts, Observations, Ephemeris, and Space Weather
            const [hourlyData, dailyData, stationData, sunData, spaceData, plasmaData] = await Promise.all([
                fetchJson(pointsData.properties.forecastHourly),
                fetchJson(pointsData.properties.forecast),
                fetchJson(pointsData.properties.observationStations),
                fetchJson(`https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LON}&formatted=0`),
                fetchJson(`https://services.swpc.noaa.gov/products/summary-planetary-k-index.json`),
                fetchJson(`https://services.swpc.noaa.gov/products/solar-wind/plasma-5-minute.json`)
            ]);

            // Step 3: Get Pressure from Latest Observation
            const latestObs = await fetchJson(`${stationData.features[0].id}/observations/latest`);
            const pa = latestObs.properties.barometricPressure.value;
            const inHg = pa ? (pa * 0.0002953).toFixed(2) : '--';
            document.getElementById('pressure').innerText = `${inHg} inHg`;

            // Step 4: Display Current Weather
            const current = hourlyData.properties.periods[0];
            document.getElementById('temp').innerText = `${current.temperature}°${current.temperatureUnit}`;
            document.getElementById('conditions').innerText = current.shortForecast;
            document.getElementById('forecast').innerText = current.detailedForecast;
            document.getElementById('wind').innerText = `${current.windSpeed} ${current.windDirection}`;
            document.getElementById('humidity').innerText = current.relativeHumidity ? `${current.relativeHumidity.value}%` : '--';

            // Step 5: Ephemeris & Space
            document.getElementById('sunrise').innerText = new Date(sunData.results.sunrise).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('sunset').innerText = new Date(sunData.results.sunset).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('kp-index').innerText = spaceData[spaceData.length - 1].kp_index;
            document.getElementById('solar-wind').innerText = `${Math.round(plasmaData[plasmaData.length - 1][2])} km/s`;

            // Render Hourly (Next 12 hours)
            const hourlyWrap = document.getElementById('hourly-wrap');
            hourlyWrap.innerHTML = hourlyData.properties.periods.slice(1, 13).map(p => `
                <div class="forecast-item">
                    <span>${new Date(p.startTime).toLocaleTimeString([], {hour: '2-digit'})}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span style="color:#8b949e">${p.shortForecast}</span>
                </div>
            `).join('');

            // Render Daily (Next 7 days/periods)
            const dailyWrap = document.getElementById('daily-wrap');
            dailyWrap.innerHTML = dailyData.properties.periods.map(p => `
                <div class="forecast-item" style="min-width: 120px;">
                    <span style="font-weight:bold; color:#f0f6fc">${p.name}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span>${p.shortForecast}</span>
                </div>
            `).join('');
            
            const now = new Date();
            document.getElementById('timestamp').innerText = `Last updated: ${now.toLocaleTimeString()}`;

        } catch (error) {
            console.error(error);
            document.getElementById('timestamp').innerText = "Error loading weather data.";
        }
    }

    // Run automatically on load
    window.onload = getWeather;
</script>

</body>
</html>
