<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="weather.css">
    <style>
        body { height: 100vh; overflow: hidden; margin: 0; padding: 0; font-size: 0.8rem; }
        .container { 
            height: 100vh; 
            margin-left: 250px;
            width: calc(100% - 250px);
            max-width: none !important;
            border-left: 1px solid var(--border-color);
            display: flex; 
            flex-direction: column; 
            padding: 2px 8px 8px 8px; 
            gap: 4px; 
            box-sizing: border-box;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; }
        h1 { font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        h2 { font-size: 0.75rem; margin-top: 0; margin-bottom: 5px; text-transform: uppercase; color: #8b949e; }
        .data-grid { display: flex !important; gap: 5px !important; margin-bottom: 0 !important; }
        .data-card { padding: 4px 8px !important; flex: 1; min-width: 0; text-align: center; }
        .data-card label { font-size: 0.6rem; margin-bottom: 2px; }
        .data-card .value { font-size: 0.8rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .section-box { padding: 8px !important; margin: 0 !important; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .radar-container { height: 100% !important; min-height: 120px; }
        .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px !important; flex: 1.4; min-height: 0; }
        .forecast-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 0.6; min-height: 0; }
        .scroll-v { overflow-y: auto; flex: 1; }
        button { padding: 4px 12px !important; font-size: 0.7rem; width: auto !important; margin: 0 !important; }
        .status { font-size: 0.7rem; }
        .webcam-vid { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #000; border-radius: 4px; }
        .forecast-item { padding: 4px !important; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem; }
        .f-temp { font-size: 0.8rem !important; margin: 0 !important; }

        /* Earthquake Sidebar Styles */
        :root { --border-color: #30363d; --bg-color: #0d1117; --card-bg: #161b22; --accent-color: #58a6ff; }
        .eq-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            font-family: -apple-system, sans-serif;
        }
        .eq-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        .eq-header h3 { margin: 0; font-size: 0.9rem; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        #eq-count { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
        .eq-list { flex: 1; overflow-y: auto; }
        .eq-item { 
            display: flex; 
            padding: 10px 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer;
            transition: background 0.2s;
        }
        .eq-item:hover { background: rgba(255, 255, 255, 0.03); }
        .eq-mag-col { width: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 800; color: var(--accent-color); }
        .eq-mag-high { color: #ff7b72 !important; } /* Visual highlight for M4.5+ */
        .eq-details { flex: 1; padding-left: 10px; display: flex; flex-direction: column; gap: 2px; }
        .eq-place { color: #f0f6fc; font-weight: 600; font-size: 0.75rem; }
        .eq-time { color: #8b949e; font-size: 0.65rem; }
        .eq-depth { color: #58a6ff; font-size: 0.65rem; font-weight: 500; }
    </style>
</head>
<body>
<div class="eq-sidebar">
    <div class="eq-header">
        <h3>Search Results</h3>
        <div id="eq-count">0 earthquakes found</div>
    </div>
    <div id="eq-list" class="eq-list"></div>
</div>

<div class="container">
    <div class="header-row">
        <h1>Live Weather Watch <span class="live-indicator">Live</span></h1>
        <div id="location" style="font-weight: bold; color: var(--accent-color);">Detecting...</div>
        <div id="current-time" style="font-family: monospace; font-size: 1rem; color: #fff; font-weight: bold;">--:--:--</div>
        <div class="flex items-center gap-4">
            <span class="status" id="timestamp">Initializing...</span>
            <button onclick="getWeather()">Refresh</button>
        </div>
    </div>
    
    <div class="data-grid">
        <div class="data-card"><label>Temp</label><span class="value" id="temp">--</span></div>
        <div class="data-card"><label>Conditions</label><span class="value" id="conditions">--</span></div>
        <div class="data-card"><label>Wind</label><span class="value" id="wind">--</span></div>
        <div class="data-card"><label>Humidity</label><span class="value" id="humidity">--</span></div>
        <div class="data-card"><label>Pressure</label><span class="value" id="pressure">--</span></div>
        <div class="data-card"><label>Solar Wind</label><span class="value" id="solar-wind">--</span></div>
        <div class="data-card"><label>Sunrise</label><span class="value" id="sunrise">--</span></div>
        <div class="data-card"><label>Sunset</label><span class="value" id="sunset">--</span></div>
    </div>

    <div class="forecast-row">
        <div class="section-box">
            <h2>Hourly Look-Ahead</h2>
            <div id="hourly-wrap" class="scroll-v"><div class="status">Loading...</div></div>
        </div>
        <div class="section-box">
            <h2>7-Day Forecast</h2>
            <div id="daily-wrap" class="scroll-v"><div class="status">Loading...</div></div>
        </div>
    </div>

    <div class="module-grid">
        <div class="section-box">
            <h2>Radar (KRGX)</h2>
            <div class="radar-container">
                <img src="https://radar.weather.gov/ridge/standard/KRGX_0.gif" style="width:100%; height:100%; object-fit:cover;">
            </div>
        </div>
        <div class="section-box">
            <h2>Traffic Cameras</h2>
            <div style="position: relative; flex: 1; overflow: hidden; background: #000; border-radius: 4px;">
                <video id="webcam1" class="webcam-vid" style="position: absolute; inset: 0; height: 100%; transition: opacity 1s;" autoplay muted playsinline></video>
                <video id="webcam2" class="webcam-vid" style="position: absolute; inset: 0; height: 100%; transition: opacity 1s; opacity: 0;" autoplay muted playsinline></video>
            </div>
        </div>
    </div>
</div>
<script>
    // Coordinates for Carson City / Dayton Area
    const LAT = 39.1638;
    const LON = -119.7674;
    
    // --- Earthquake Sidebar Logic ---
    const EQ_URL = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson";

    async function fetchEarthquakes() {
        try {
            const data = await fetchJson(EQ_URL, 5000);
            const list = document.getElementById('eq-list');
            const countDisplay = document.getElementById('eq-count');
            
            if (!data || !data.features) return;
            
            countDisplay.innerText = `${data.features.length} earthquakes found`;
            
            // Performance Refactor: Limit processing and use DocumentFragment
            const fragment = document.createDocumentFragment();
            const recentEvents = data.features.slice(0, 50);

            recentEvents.forEach(feat => {
                const props = feat.properties;
                const item = document.createElement('div');
                item.className = 'eq-item';
                item.onclick = () => window.open(props.url, '_blank');

                const mag = props.mag ? props.mag.toFixed(1) : "N/A";
                const isHigh = props.mag >= 4.5;
                const depth = feat.geometry.coordinates[2].toFixed(1);
                const ts = new Date(props.time).toISOString().replace('T', ' ').split('.')[0] + ' UTC';

                item.innerHTML = `
                    <div class="eq-mag-col ${isHigh ? 'eq-mag-high' : ''}">${mag}</div>
                    <div class="eq-details">
                        <div class="eq-place">${props.place}</div>
                        <div class="eq-time">${ts}</div>
                        <div class="eq-depth">${depth} km depth</div>
                    </div>
                `;
                fragment.appendChild(item);
            });

            list.innerHTML = ''; 
            list.appendChild(fragment);
            
            addToLog(`Seismic data updated: ${data.features.length} events.`);
        } catch (e) {
            console.error("USGS Fetch Error:", e);
            addToLog(`Earthquake Sync Error: ${e.message}`);
        }
    }

    // Initial load and 5-minute interval
    fetchEarthquakes();
    setInterval(fetchEarthquakes, 300000); 


    // --- Existing Weather Dashboard Logic ---
    
    async function fetchJson(url, timeout = 5000, headers = {}) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const res = await fetch(url, { 
                cache: 'no-store',
                signal: controller.signal,
                headers: { 'Accept': 'application/geo+json', ...headers }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally {
            clearTimeout(id);
        }
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour12: true });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function addToLog(message) {
        const log = document.getElementById('update-log');
        if (!log) return;
        const time = new Date().toLocaleTimeString();
        log.innerHTML = `<div>[${time}] ${message}</div>` + log.innerHTML;
    }

    async function getWeather() {
        document.getElementById('timestamp').innerText = "Fetching live data...";
        const nwsHeaders = { 'User-Agent': '(AndrewsIndustries Weather App, contact: andre@example.com)' };

        try {
            // Step 1: Get NWS grid points for the coordinates
            const pointsData = await fetchJson(`https://api.weather.gov/points/${LAT},${LON}`, 5000, nwsHeaders);
            
            // Get city/state info from metadata
            const city = pointsData.properties.relativeLocation.properties.city;
            const state = pointsData.properties.relativeLocation.properties.state;
            document.getElementById('location').innerText = `${city}, ${state} 89702`;

            // Step 2: Fetch data with Settled promises so one failure doesn't kill the whole page
            const results = await Promise.allSettled([
                fetchJson(pointsData.properties.forecastHourly, 5000, nwsHeaders), // 0
                fetchJson(pointsData.properties.forecast, 5000, nwsHeaders),       // 1
                fetchJson(pointsData.properties.observationStations, 5000, nwsHeaders), // 2
                fetchJson(`https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LON}&formatted=0`, 5000), // 3
                fetchJson(`https://services.swpc.noaa.gov/products/summary-planetary-k-index.json`), // 4
                fetchJson(`https://services.swpc.noaa.gov/products/solar-wind/plasma-5-minute.json`) // 5
            ]);

            const hourlyData = results[0].status === 'fulfilled' ? results[0].value : null;
            const dailyData = results[1].status === 'fulfilled' ? results[1].value : null;
            const stationData = results[2].status === 'fulfilled' ? results[2].value : null;
            const sunData = results[3].status === 'fulfilled' ? results[3].value : null;
            const spaceData = results[4].status === 'fulfilled' ? results[4].value : null;
            const plasmaData = results[5].status === 'fulfilled' ? results[5].value : null;

            // Step 3: Get Pressure from Latest Observation
            if (stationData && stationData.features && stationData.features.length > 0) {
                try {
                    const latestObs = await fetchJson(`${stationData.features[0].id}/observations/latest`, 5000, nwsHeaders);
                    const pa = latestObs.properties?.barometricPressure?.value;
                    const inHg = pa ? (pa * 0.0002953).toFixed(2) : '--';
                    document.getElementById('pressure').innerText = `${inHg} inHg`;
                } catch (obsError) {
                    document.getElementById('pressure').innerText = '--';
                }
            }

            // Step 4: Display Current Weather
            if (hourlyData) {
                const current = hourlyData.properties.periods[0];
                document.getElementById('temp').innerText = `${current.temperature}°${current.temperatureUnit}`;
                document.getElementById('conditions').innerText = current.shortForecast;
                document.getElementById('wind').innerText = `${current.windSpeed} ${current.windDirection}`;
                document.getElementById('humidity').innerText = current.relativeHumidity ? `${current.relativeHumidity.value}%` : '--';
            }

            // Step 5: Ephemeris & Space
            if (sunData) {
                document.getElementById('sunrise').innerText = new Date(sunData.results.sunrise).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                document.getElementById('sunset').innerText = new Date(sunData.results.sunset).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
            
            if (plasmaData && plasmaData.length > 1) {
                const latestSpeed = plasmaData[plasmaData.length - 1][2];
                const val = latestSpeed && !isNaN(latestSpeed) ? `${Math.round(latestSpeed)} km/s` : 'Steady';
                document.getElementById('solar-wind').innerText = val;
            }

            // Render Hourly (Next 12 hours)
            if (hourlyData) {
                const hourlyWrap = document.getElementById('hourly-wrap');
            // Use a vertical list for better space efficiency in columns
            hourlyWrap.innerHTML = hourlyData.properties.periods.slice(1, 13).map(p => `
                <div class="forecast-item">
                    <span style="width: 40px;">${new Date(p.startTime).toLocaleTimeString([], {hour: 'numeric'})}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span style="color:#8b949e; flex: 1; text-align: right; font-size: 0.65rem;">${p.shortForecast}</span>
                </div>
            `).join('');
            }

            // Render Daily (Next 7 days/periods)
            if (dailyData) {
                const dailyWrap = document.getElementById('daily-wrap');
            // Use a vertical list for better space efficiency in columns
            dailyWrap.innerHTML = dailyData.properties.periods.slice(0, 10).map(p => `
                <div class="forecast-item">
                    <span style="font-weight:bold; color:#f0f6fc; width: 60px;">${p.name}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span style="flex: 1; text-align: right; font-size: 0.65rem;">${p.shortForecast}</span>
                </div>
            `).join('');
            }
            
            const now = new Date();
            document.getElementById('timestamp').innerText = `Last updated: ${now.toLocaleTimeString()}`;
            addToLog("Successfully synchronized with NWS and SWPC data.");

        } catch (error) {
            console.error(error);
            document.getElementById('timestamp').innerText = "Error loading weather data.";
            addToLog(`Critical Error: ${error.message}`);
        }
    }

    // Run automatically on load
    window.onload = getWeather;
    // Auto-refresh every 10 minutes (600,000 milliseconds)
    setInterval(getWeather, 600000);

    // Initialize Traffic Camera Streams (HLS)
    const initStream = (id, src) => {
        const video = document.getElementById(id);
        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 60,
                maxBufferLength: 30,
                maxMaxBufferLength: 60
            });
            hls.loadSource(src);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;
        }
    };

    initStream('webcam1', 'https://d2wse2.its.nv.gov:443/renoxcd02/6d2490ff-1896-4369-b7e4-92fd1a542642_hspflirxcd02_public.stream/playlist.m3u8');
    initStream('webcam2', 'https://d2wse1.its.nv.gov/renoxcd01/fbafdf3c-454d-40b7-a000-801b4c5518da_hspflirxcd01_public.stream/playlist.m3u8');

    // Traffic Camera Slideshow Logic
    let activeCam = 1;
    setInterval(() => {
        const v1 = document.getElementById('webcam1');
        const v2 = document.getElementById('webcam2');
        activeCam = activeCam === 1 ? 2 : 1;
        v1.style.opacity = activeCam === 1 ? "1" : "0";
        v2.style.opacity = activeCam === 2 ? "1" : "0";
    }, 15000); // Swaps every 15 seconds
</script>

</body>
</html>
