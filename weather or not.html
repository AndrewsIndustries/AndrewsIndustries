<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="weather.css">
    <style>
        body { height: 100vh; overflow: hidden; margin: 0; padding: 0; font-size: 0.8rem; }
        .container { 
            height: 100vh; 
            max-width: 100% !important;
            display: flex; 
            flex-direction: column; 
            padding: 8px; 
            gap: 8px; 
            box-sizing: border-box;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        h1 { font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        h2 { font-size: 0.75rem; margin-top: 0; margin-bottom: 5px; text-transform: uppercase; color: #8b949e; }
        .data-grid { display: flex !important; gap: 5px !important; margin-bottom: 0 !important; }
        .data-card { padding: 4px 8px !important; flex: 1; min-width: 0; text-align: center; }
        .data-card label { font-size: 0.6rem; margin-bottom: 2px; }
        .data-card .value { font-size: 0.8rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .section-box { padding: 8px !important; margin: 0 !important; flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .radar-container { height: 100% !important; min-height: 180px; }
        .module-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 8px !important; flex: 1; min-height: 0; }
        .scroll-v { overflow-y: auto; flex: 1; }
        #update-log { max-height: 60px !important; font-size: 0.65rem !important; background: rgba(0,0,0,0.2); border-radius: 4px; padding: 4px; }
        button { padding: 4px 12px !important; font-size: 0.7rem; width: auto !important; margin: 0 !important; }
        .status { font-size: 0.7rem; }
        #webcam { height: 100px; object-fit: cover; background: #000; }
        .forecast-item { padding: 4px !important; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.75rem; }
        .f-temp { font-size: 0.8rem !important; margin: 0 !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-row">
        <h1>Live Weather Watch <span class="live-indicator">Live</span></h1>
        <div id="location" style="font-weight: bold; color: var(--accent-color);">Detecting...</div>
        <div class="flex items-center gap-4">
            <span class="status" id="timestamp">Initializing...</span>
            <button onclick="getWeather()">Refresh</button>
        </div>
    </div>
    
    <div class="data-grid">
        <div class="data-card"><label>Temp</label><span class="value" id="temp">--</span></div>
        <div class="data-card"><label>Conditions</label><span class="value" id="conditions">--</span></div>
        <div class="data-card"><label>Wind</label><span class="value" id="wind">--</span></div>
        <div class="data-card"><label>Humidity</label><span class="value" id="humidity">--</span></div>
        <div class="data-card"><label>Pressure</label><span class="value" id="pressure">--</span></div>
        <div class="data-card"><label>Solar Wind</label><span class="value" id="solar-wind">--</span></div>
        <div class="data-card" style="flex: 2;"><label>Short-term Outlook</label><span class="value" id="forecast" style="font-weight: normal;">--</span></div>
    </div>

    <div class="module-grid">
        <div class="section-box">
            <h2>Radar (KRGX)</h2>
            <div class="radar-container">
                <img src="https://radar.weather.gov/ridge/standard/KRGX_0.gif" style="width:100%; height:100%; object-fit:cover;">
            </div>
        </div>
        
        <div class="section-box">
            <h2>Space & Traffic</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px;">
                <div class="data-card"><label>Rise</label><span class="value" id="sunrise">--</span></div>
                <div class="data-card"><label>Set</label><span class="value" id="sunset">--</span></div>
                <div class="data-card"><label>Kp</label><span class="value" id="kp-index">--</span></div>
                <div class="data-card"><label>Plasma</label><span class="value" id="plasma-status">--</span></div>
            </div>
            <video id="webcam" style="width:100%; border-radius:4px;" autoplay muted playsinline></video>
        </div>

        <div class="section-box">
            <h2>Hourly Look-Ahead</h2>
            <div id="hourly-wrap" class="scroll-v">
                <div class="status">Loading hourly data...</div>
            </div>
        </div>

        <div class="section-box">
            <h2>7-Day Forecast</h2>
            <div id="daily-wrap" class="scroll-v">
                <div class="status">Loading 7-day data...</div>
            </div>
        </div>
    </div>

    <div class="section-box">
        <h2>System Log</h2>
        <div id="update-log" style="font-family: monospace; font-size: 0.8rem; color: #8b949e; max-height: 80px; overflow-y: auto;"></div>
    </div>
</div>
<script>
    // Coordinates for Carson City / Dayton Area
    const LAT = 39.1638;
    const LON = -119.7674;
    
    async function fetchJson(url) {
        const res = await fetch(url, {
            cache: 'no-store',
            headers: { 
                'Accept': 'application/geo+json'
            }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }

    function addToLog(message) {
        const log = document.getElementById('update-log');
        const time = new Date().toLocaleTimeString();
        log.innerHTML = `<div>[${time}] ${message}</div>` + log.innerHTML;
    }

    async function getWeather() {
        document.getElementById('timestamp').innerText = "Fetching live data...";
        try {
            // Step 1: Get NWS grid points for the coordinates
            const pointsData = await fetchJson(`https://api.weather.gov/points/${LAT},${LON}`);
            
            // Get city/state info from metadata
            const city = pointsData.properties.relativeLocation.properties.city;
            const state = pointsData.properties.relativeLocation.properties.state;
            document.getElementById('location').innerText = `${city}, ${state} 89702`;
            addToLog(`Location locked: ${city}, ${state}`);

            // Step 2: Fetch data with Settled promises so one failure doesn't kill the whole page
            const results = await Promise.allSettled([
                fetchJson(pointsData.properties.forecastHourly), // 0
                fetchJson(pointsData.properties.forecast),       // 1
                fetchJson(pointsData.properties.observationStations), // 2
                fetchJson(`https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LON}&formatted=0`), // 3
                fetchJson(`https://services.swpc.noaa.gov/products/summary-planetary-k-index.json`), // 4
                fetchJson(`https://services.swpc.noaa.gov/products/solar-wind/plasma-5-minute.json`) // 5
            ]);

            const hourlyData = results[0].status === 'fulfilled' ? results[0].value : null;
            const dailyData = results[1].status === 'fulfilled' ? results[1].value : null;
            const stationData = results[2].status === 'fulfilled' ? results[2].value : null;
            const sunData = results[3].status === 'fulfilled' ? results[3].value : null;
            const spaceData = results[4].status === 'fulfilled' ? results[4].value : null;
            const plasmaData = results[5].status === 'fulfilled' ? results[5].value : null;

            // Step 3: Get Pressure from Latest Observation
            if (stationData && stationData.features && stationData.features.length > 0) {
                const latestObs = await fetchJson(`${stationData.features[0].id}/observations/latest`);
                const pa = latestObs.properties?.barometricPressure?.value;
                const inHg = pa ? (pa * 0.0002953).toFixed(2) : '--';
                document.getElementById('pressure').innerText = `${inHg} inHg`;
            }

            // Step 4: Display Current Weather
            if (hourlyData) {
                const current = hourlyData.properties.periods[0];
                document.getElementById('temp').innerText = `${current.temperature}°${current.temperatureUnit}`;
                document.getElementById('conditions').innerText = current.shortForecast;
                document.getElementById('forecast').innerText = current.detailedForecast;
                document.getElementById('wind').innerText = `${current.windSpeed} ${current.windDirection}`;
                document.getElementById('humidity').innerText = current.relativeHumidity ? `${current.relativeHumidity.value}%` : '--';
            }

            // Step 5: Ephemeris & Space
            if (sunData) {
                document.getElementById('sunrise').innerText = new Date(sunData.results.sunrise).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                document.getElementById('sunset').innerText = new Date(sunData.results.sunset).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
            
            if (spaceData && spaceData.length > 0) {
                document.getElementById('kp-index').innerText = spaceData[spaceData.length - 1].kp_index;
            }

            if (plasmaData && plasmaData.length > 1) {
                const latestSpeed = plasmaData[plasmaData.length - 1][2];
                const val = latestSpeed && !isNaN(latestSpeed) ? `${Math.round(latestSpeed)} km/s` : 'Steady';
                document.getElementById('solar-wind').innerText = val;
                document.getElementById('plasma-status').innerText = val;
            }

            // Render Hourly (Next 12 hours)
            if (hourlyData) {
                const hourlyWrap = document.getElementById('hourly-wrap');
            // Use a vertical list for better space efficiency in columns
            hourlyWrap.innerHTML = hourlyData.properties.periods.slice(1, 13).map(p => `
                <div class="forecast-item">
                    <span style="width: 40px;">${new Date(p.startTime).toLocaleTimeString([], {hour: 'numeric'})}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span style="color:#8b949e; flex: 1; text-align: right; font-size: 0.65rem;">${p.shortForecast}</span>
                </div>
            `).join('');
            }

            // Render Daily (Next 7 days/periods)
            if (dailyData) {
                const dailyWrap = document.getElementById('daily-wrap');
            // Use a vertical list for better space efficiency in columns
            dailyWrap.innerHTML = dailyData.properties.periods.slice(0, 10).map(p => `
                <div class="forecast-item">
                    <span style="font-weight:bold; color:#f0f6fc; width: 60px;">${p.name}</span>
                    <div class="f-temp">${p.temperature}°</div>
                    <span style="flex: 1; text-align: right; font-size: 0.65rem;">${p.shortForecast}</span>
                </div>
            `).join('');
            }
            
            const now = new Date();
            document.getElementById('timestamp').innerText = `Last updated: ${now.toLocaleTimeString()}`;
            addToLog("Successfully synchronized with NWS and SWPC data.");

        } catch (error) {
            console.error(error);
            document.getElementById('timestamp').innerText = "Error loading weather data.";
            addToLog(`Critical Error: ${error.message}`);
        }
    }

    // Run automatically on load
    window.onload = getWeather;
    // Auto-refresh every 10 minutes (600,000 milliseconds)
    setInterval(getWeather, 600000);

    // Initialize Traffic Camera Stream (HLS)
    const video = document.getElementById('webcam');
    const videoSrc = 'https://d2wse2.its.nv.gov:443/renoxcd02/6d2490ff-1896-4369-b7e4-92fd1a542642_hspflirxcd02_public.stream/playlist.m3u8';
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
    }
</script>

</body>
</html>
