<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Page</title>
    <link rel="icon" type="image/x-icon" href="images/Icon/FlagEaglenoback.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            margin: 0;
            padding: 40px;
            font-family: 'Inter', sans-serif;
            background: url('images/Backgrounds/dashboard.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 60px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
            max-width: 1400px;
            width: 100%;
        }

        .qr-item {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .qr-item:hover {
            transform: translateY(-10px);
            background: rgba(30, 41, 59, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .qr-name {
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            object-fit: contain;
        }

        .qr-link {
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .qr-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Floating Sneak Peek Window */
        #previewPane {
            position: fixed;
            width: 450px;
            height: 300px;
            background: #000;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            z-index: 10001;
            display: none;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            pointer-events: none; /* Allows mousing over the pane without flickering */
            transition: opacity 0.2s ease;
        }

        #previewPane iframe {
            width: 100%;
            height: 100%;
            border: none;
            zoom: 0.75; /* Scale down the site to fit the peek window */
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .sync-btn {
            background: #16a34a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .sync-btn:hover { transform: scale(1.05); background: #15803d; }
    </style>
</head>
<body>

    <div id="previewPane"><iframe id="previewFrame" src="about:blank"></iframe></div>

    <div class="controls">
        <button id="syncBtn" class="sync-btn" onclick="triggerGenerator()">
            Sync QR Assets
        </button>
    </div>

    <h1 class="header-title">QR Page</h1>

    <div class="qr-grid" id="qrContainer">
        <div style="grid-column: span 5; text-align: center; font-size: 1.5rem; opacity: 0.6;">Loading Assets...</div>
    </div>

    <script>
        const previewPane = document.getElementById('previewPane');
        const previewFrame = document.getElementById('previewFrame');

        function showPreview(url, e) {
            if (previewFrame.src !== url) previewFrame.src = url;
            previewPane.style.display = 'block';
            movePreview(e);
        }

        function movePreview(e) {
            let x = e.clientX + 20;
            let y = e.clientY + 20;
            
            // Keep preview inside window bounds
            if (x + 470 > window.innerWidth) x = e.clientX - 470;
            if (y + 320 > window.innerHeight) y = e.clientY - 320;

            previewPane.style.left = x + 'px';
            previewPane.style.top = y + 'px';
        }

        function hidePreview() {
            previewPane.style.display = 'none';
            previewFrame.src = 'about:blank'; // Stop loading/audio when hidden
        }

        async function triggerGenerator() {
            const repo = "AndrewsIndustries/AndrewsIndustries";
            const syncBtn = document.getElementById('syncBtn');
            
            let token = localStorage.getItem('andrews_gh_pat');
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token:");
                if (!token) return;
                localStorage.setItem('andrews_gh_pat', token);
            }

            syncBtn.innerText = "Triggering...";
            syncBtn.disabled = true;

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'generate-qrs'
                    })
                });

                if (response.ok) {
                    alert('Sync started! GitHub is now running the QR Generator. Refresh the page in 1-2 minutes to see changes.');
                } else {
                    const err = await response.text();
                    console.error(err);
                    if (response.status === 401) {
                        alert("GitHub Token invalid. Clearing token...");
                        localStorage.removeItem('andrews_gh_pat');
                    } else {
                        alert("Failed to trigger sync. Check console for details.");
                    }
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                syncBtn.innerText = "Sync QR Assets";
                syncBtn.disabled = false;
            }
        }

        async function loadData() {
            // Correcting the URL to ensure it pulls CSV data instead of HTML
            const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTp9TnMwxNNqwp3Ol3kjBaxvwvsyX9iLUltpNS6kMNhyARRYMYMIFwKNoW3D25XxACg2jk1MpKNOdCE/pub';
            const SHEET_CSV = `${BASE_URL}?output=csv`;
            
            const container = document.getElementById('qrContainer');
            const targetUrl = `${SHEET_CSV}&cache_buster=${Date.now()}`;

            try {
                let csvText;
                console.log("Fetching from:", targetUrl);

                // Attempt 1: Direct Fetch (Works when hosted on a server)
                try {
                    const response = await fetch(targetUrl);
                    if (response.ok) csvText = await response.text();
                } catch (e) {
                    console.warn("Direct fetch blocked (CORS), trying proxy...");
                }

                // Attempt 2: AllOrigins Proxy Fallback (Works for local file://)
                if (!csvText) {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                    const response = await fetch(proxyUrl);
                    if (response.ok) csvText = await response.text();
                }

                if (!csvText) throw new Error("Could not access spreadsheet data. Ensure the sheet is 'Published to the web' as CSV.");
                
                const rows = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
                container.innerHTML = ''; 

                if (rows.length <= 1) {
                    container.innerHTML = `<div style="grid-column: span 5; text-align: center; opacity: 0.6;">No data found.</div>`;
                    return;
                }

                rows.slice(1).forEach(row => { // skip header row
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    const link = cols[0];
                    const name = cols[1];

                    // Sanitize name to match the filename created by the Python script
                    const safeFileName = name.trim().replace(/[^a-z0-9_]/gi, '_') + '.jpg';
                    const localImgPath = `images/QRCodes/${safeFileName}`;

                    if (name && link) {
                        const item = document.createElement('div');
                        item.className = 'qr-item';
                        item.innerHTML = `
                            <div class="qr-name">${name}</div>
                            <a href="${link}" target="_blank">
                                <img src="${localImgPath}" 
                                     onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}'" 
                                     alt="${name}" class="qr-image">
                            </a>
                            <a href="${link}" target="_blank" class="qr-link">Link</a>
                        `;

                        item.addEventListener('mouseenter', (e) => showPreview(link, e));
                        item.addEventListener('mousemove', (e) => movePreview(e));
                        item.addEventListener('mouseleave', hidePreview);

                        container.appendChild(item);
                    }
                });
            } catch (err) {
                container.innerHTML = `<div style="grid-column: span 5; color: #ef4444;">Failed to load spreadsheet data.</div>`;
                console.error(err);
            }
        }

        window.onload = loadData;
    </script>

</body>
</html>
