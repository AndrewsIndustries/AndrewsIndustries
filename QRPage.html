<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Page</title>
    <link rel="icon" type="image/x-icon" href="images/Icon/FlagEaglenoback.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            margin: 0;
            padding: 40px;
            font-family: 'Inter', sans-serif;
            background: url('images/Backgrounds/dashboard.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .qr-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
            max-width: 1400px;
            width: 100%;
        }

        .qr-item {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .qr-item:hover {
            transform: translateY(-10px);
            background: rgba(30, 41, 59, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .qr-name {
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            object-fit: contain;
        }

        .qr-link {
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .qr-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Floating Sneak Peek Window */
        #previewPane {
            position: fixed;
            width: 450px;
            height: 300px;
            background: #000;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            z-index: 10001;
            display: none;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            pointer-events: none; /* Allows mousing over the pane without flickering */
            transition: opacity 0.2s ease;
        }

        #previewPane iframe {
            width: 100%;
            height: 100%;
            border: none;
            zoom: 0.75; /* Scale down the site to fit the peek window */
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .sync-btn {
            background: #16a34a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .sync-btn:hover { transform: scale(1.05); background: #15803d; }
    </style>
</head>
<body>

    <div id="previewPane"><iframe id="previewFrame" src="about:blank"></iframe></div>

    <div class="controls">
        <button id="syncBtn" class="sync-btn" onclick="triggerGenerator()">
            Sync QR Assets
        </button>
    </div>


    <div class="qr-grid" id="qrContainer">
        <div style="grid-column: span 5; text-align: center; font-size: 1.5rem; opacity: 0.6;">Loading Assets...</div>
    </div>

    <script src="qrcodes_logic.js"></script>

</body>
</html>
